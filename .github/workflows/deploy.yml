name: Deploy BE to VPS

on:
  push:
    branches:
      - master
  # Cho phép chạy tay từ tab Actions trên GitHub — hữu ích khi chỉ đổi
  # GitHub Secret (BE_ENV_FILE...) và cần đồng bộ lại VPS mà không muốn push code.
  workflow_dispatch:

concurrency:
  group: deploy-be-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================
  # Job 1: Build & push image
  # =========================
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Tag theo git SHA để VPS chạy đúng chính xác bản vừa build (rollback được
      # bằng cách deploy lại 1 SHA cũ), không chỉ phụ thuộc vào "latest" mơ hồ.
      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push BE image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/be-app:latest
            ghcr.io/${{ github.repository_owner }}/be-app:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================
  # Job 2: Deploy to VPS
  # (job riêng — nếu chỉ bước SSH/deploy lỗi, có thể "Re-run failed jobs"
  # để chạy lại đúng job này, không cần build lại image từ đầu)
  # =========================
  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            echo "🔧 Sync env file từ GitHub Secret (nếu secret đã có nội dung)"
            mkdir -p /home/deploy/env
            cat > /tmp/be.env.new << '__BE_ENV_EOF__'
            ${{ secrets.BE_ENV_FILE }}
            __BE_ENV_EOF__

            if [ -s /tmp/be.env.new ] && grep -q '=' /tmp/be.env.new; then
              mv /tmp/be.env.new /home/deploy/env/be.env
              chmod 600 /home/deploy/env/be.env
              echo "✅ Đã đồng bộ be.env từ GitHub Secret BE_ENV_FILE"
            else
              rm -f /tmp/be.env.new
              echo "⚠️  Secret BE_ENV_FILE trống hoặc chưa được tạo — GIỮ NGUYÊN be.env hiện có trên VPS, không ghi đè."
              if [ ! -s /home/deploy/env/be.env ]; then
                echo "❌ /home/deploy/env/be.env không tồn tại/trống trên VPS và secret cũng trống. Dừng deploy."
                exit 1
              fi
            fi

            echo "🔎 Kiểm tra DATABASE_URL có trong be.env không (báo lỗi rõ sớm, thay vì để Prisma báo lỗi khó hiểu)"
            DB_URL_LINE=$(grep '^DATABASE_URL=' /home/deploy/env/be.env || true)
            if [ -z "$DB_URL_LINE" ] || [ "$DB_URL_LINE" = "DATABASE_URL=" ]; then
              echo "❌ DATABASE_URL thiếu hoặc trống trong /home/deploy/env/be.env trên VPS."
              echo "   → SSH vào VPS, kiểm tra/thêm dòng DATABASE_URL=... vào file đó,"
              echo "     hoặc điền secret BE_ENV_FILE trên GitHub cho đầy đủ."
              exit 1
            fi

            echo "🔐 Login GHCR"
            docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR_TOKEN }}

            echo "⬇️ Pull image (tag: ${{ needs.build.outputs.tag }})"
            docker pull ghcr.io/${{ github.repository_owner }}/be-app:${{ needs.build.outputs.tag }}
            docker tag ghcr.io/${{ github.repository_owner }}/be-app:${{ needs.build.outputs.tag }} ghcr.io/${{ github.repository_owner }}/be-app:latest

            echo "🗄️ Run database migrations (dừng deploy ngay nếu migration lỗi)"
            docker run --rm \
              --network thienloc-net \
              --env-file /home/deploy/env/be.env \
              ghcr.io/${{ github.repository_owner }}/be-app:${{ needs.build.outputs.tag }} \
              npx prisma migrate deploy --config=prisma.config.js

            echo "🛑 Stop old container"
            docker stop be-app || true
            docker rm be-app || true

            echo "🚀 Run new container"
            docker run -d \
              --name be-app \
              --network thienloc-net \
              -p 4000:4000 \
              --env-file /home/deploy/env/be.env \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/be-app:${{ needs.build.outputs.tag }}

            echo "🩺 Health check: đợi container thật sự chạy ổn định"
            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' be-app)" != "true" ]; then
              echo "❌ Container be-app không chạy sau khi start. Logs:"
              docker logs --tail 100 be-app
              exit 1
            fi
            echo "✅ BE container status"
            docker ps | grep be-app

            echo "🧹 Dọn image cũ (giữ image đang dùng, xoá image không còn container nào tham chiếu)"
            docker image prune -f
