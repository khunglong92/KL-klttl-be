name: Deploy BE to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Login GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 3️⃣ Set up Docker Buildx (for caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Build & push BE image with GHA Cache
      - name: Build & push BE image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/be-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5️⃣ Deploy to VPS
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR_TOKEN }}

            docker pull ghcr.io/${{ github.repository_owner }}/be-app:latest

            # 🔥 Run database migrations using a temporary container on VPS
            docker run --rm \
              --network thienloc-net \
              --env-file /home/deploy/env/be.env \
              ghcr.io/${{ github.repository_owner }}/be-app:latest \
              npx prisma migrate deploy --config=prisma.config.js

            # Stop and restart the backend application
            docker stop be-app || true
            docker rm be-app || true

            docker run -d \
              --name be-app \
              --network thienloc-net \
              -p 4000:4000 \
              --env-file /home/deploy/env/be.env \
              ghcr.io/${{ github.repository_owner }}/be-app:latest
