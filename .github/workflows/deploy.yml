name: Deploy BE to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Setup Node (để chạy Prisma CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install deps (để có prisma CLI + schema + config)
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 🔥 4️⃣ RUN MIGRATION (QUAN TRỌNG NHẤT)
      - name: Prisma migrate deploy (PRODUCTION)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma migrate deploy --config=prisma.config.js

      # 5️⃣ Login GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 6️⃣ Build & push BE image
      - name: Build & push BE image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/be-app:latest .
          docker push ghcr.io/${{ github.repository_owner }}/be-app:latest

      # 7️⃣ Deploy to VPS
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR_TOKEN }}

            docker pull ghcr.io/${{ github.repository_owner }}/be-app:latest

            docker stop be-app || true
            docker rm be-app || true

            docker run -d \
              --name be-app \
              --network thienloc-net \
              -p 4000:4000 \
              --env-file /home/deploy/env/be.env \
              ghcr.io/${{ github.repository_owner }}/be-app:latest
